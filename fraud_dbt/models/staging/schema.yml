version: 2

models:
  - name: stg_transactions
    description: "Staging model: light cleaning, typing and renaming of raw credit card transactions."
    columns:
      - name: transaction_id
        description: "Unique identifier generated by the ingestion pipeline."
        tests: [not_null, unique]

      - name: transaction_time
        description: "Time elapsed in seconds since the first transaction."
        tests: [not_null]

      - name: amount
        description: "Original transaction amount. Must be positive or zero."
        tests: [not_null]

      - name: class
        description: "Fraud label: 0 = normal transaction, 1 = fraudulent transaction."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: v1
        description: "Anonymized PCA feature V1."
      - name: v2
        description: "Anonymized PCA feature V2."
      - name: v3
        description: "Anonymized PCA feature V3."
