version: 2

models:
  - name: fct_transactions_ml
    description: "Final mart table containing engineered features for Machine Learning."
    columns:
      - name: transaction_id
        description: "Unique identifier of the transaction."
        tests: [not_null, unique]

      - name: transaction_time
        description: "Time elapsed in seconds since the first transaction."
        tests: [not_null]

      - name: transaction_hour_abs
        description: "Elapsed hour from the beginning of the dataset."
        tests: [not_null]

      - name: transaction_hour
        description: "Hour of the day extracted from transaction_time, from 0 to 23."
        tests: [not_null]

      - name: is_night
        description: "Binary feature: 1 if transaction occurred between 00:00 and 05:59, else 0."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: amount
        description: "Original transaction amount."
        tests: [not_null]

      - name: amount_log
        description: "Log-transformed amount using ln(amount + 1)."
        tests: [not_null]

      - name: class
        description: "Prediction target: 0 = normal transaction, 1 = fraud."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: v1
        description: "Anonymized PCA feature V1."
      - name: v2
        description: "Anonymized PCA feature V2."
      - name: v3
        description: "Anonymized PCA feature V3."
